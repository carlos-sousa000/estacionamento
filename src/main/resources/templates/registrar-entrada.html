<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Estacionamento</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        h5 {
            text-align: center;
            margin-top: 20px;
            font-weight: normal;
            color: #666;
        }

        a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Login</h2>
    <form method="post" action="/veiculo/cadastrar">


        <label for="placa">Digite a placa</label>
        <input
                required
                type="text"
                name="placa"
                id="placa"
                placeholder="Digite sua placa."
        />

        <br/>

        <label for="modelo">Modelo:</label>
        <input
                required
                type="text"
                name="modelo"
                id="modelo"
                placeholder="Digite o modelo do seu carro."
        />

        <label for="cor">Cor:</label>
        <input
                required
                type="text"
                name="cor"
                id="cor"
                placeholder="Digite a cor do seu carro."
        />
        <label for="observacao">Observações:</label>
        <input
                required
                type="text"
                name="observacao"
                id="observacao"
                placeholder="Digite as observações"
        />

        <br/>

        <button type="submit">Salvar Entrada</button>

    </form>

</div>
</body>
</html>
