<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CPS Estacionamento - Sucesso</title>

    <!-- Mesma fonte limpa e moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1f2937;
        }

        .success-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .success-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 10px;
        }

        .success-card p {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-success {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #10b981; /* Verde esmeralda suave */
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .btn-success:hover {
            background-color: #059669; /* Verde um pouco mais escuro no hover */
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="success-icon">✅</div>
    <h2>Cadastro realizado com sucesso!</h2>
    <p>Sua conta foi criada e já está pronta para uso.</p>
    <a href="/" class="btn-success">Fazer Login</a>
</div>

</body>
</html>
