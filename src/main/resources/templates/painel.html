<!DOCTYPE html>

<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Painel</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px 8%;
            display: flex;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            margin-right: auto;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-right: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: #555;
        }

        nav a.ativo {
            background-color: #555;
        }

        .sair {
            background-color: white;
            color: #333;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .sair:hover {
            background-color: #e5e5e5;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .boas-vindas {
            margin-bottom: 30px;
        }

        .boas-vindas h2 {
            margin-bottom: 8px;
        }

        .boas-vindas p {
            color: #666;
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            flex: 1;
            min-width: 220px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .card a {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .card a:hover {
            background-color: #555;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-entrada,
        .btn-saida {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-entrada {
            background-color: #28a745;
            color: white;
        }

        .btn-entrada:hover {
            background-color: #218838;
        }

        .btn-saida {
            background-color: #dc3545;
            color: white;
        }

        .btn-saida:hover {
            background-color: #c82333;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        thead {
            background-color: #333;
            color: white;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8f8f8;
        }

        @media (max-width: 800px) {
            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            header h1 {
                margin-right: 0;
            }

            nav {
                order: 3;
                width: 100%;
                margin-right: 0;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>


</head>

<body>

<header>
    <h1>Painel</h1>


    <nav>
        <a href="/painel" class="ativo">Painel</a>
        <a href="/registros">Registros</a>
        <a href="/relatorios">Relatórios</a>
        <a href="/configuracoes">Configurações</a>
    </nav>

    <a href="/" class="sair">Sair</a>


</header>

<main>


    <section class="boas-vindas">

        <h2>Bem-vindo!</h2>
        <p>Você está conectado à sua conta.</p>

        <div class="botoes">
            <a href="veiculo/registrar-entrada" class="btn-entrada">Registrar Entrada</a>
            <a href="veiculo/registrar-saida" class="btn-saida">Registrar Saída</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Hora Entrada</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="veiculo : ${veiculos}">
                <td th:text="${veiculo.placa}"></td>
                <td th:text="${veiculo.modelo}"></td>
                <td th:text="${veiculo.horaEntrada}"></td>
                <td th:text="${veiculo.estacionado}"></td>
            </tr>
            </tbody>
        </table>

    </section>


</main>

</body>
</html>
