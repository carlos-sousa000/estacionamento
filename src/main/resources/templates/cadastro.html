<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento - Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        /* Estilo da frase inferior */
        p {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        p a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Cadastro</h2>
    <form method="post" action="/efetuar_cadastro">

        <label for="nome">Nome:</label>
        <input
                required
                type="text"
                name="nome"
                id="nome"
                placeholder="Digite seu nome"
        />

        <label for="cpf">CPF:</label>
        <input
                required
                type="text"
                name="cpf"
                id="cpf"
                placeholder="Digite seu CPF"
        />

        <label for="email">E-mail:</label>
        <input
                required
                type="email"
                name="email"
                id="email"
                placeholder="Digite seu e-mail. Ex.: seuemail@exemplo.com"
        />

        <label for="senha">Senha:</label>
        <input
                required
                type="password"
                name="senha"
                id="senha"
                placeholder="Digite sua senha. Ex.: @123abc"
        />

        <label for="telefone">Telefone:</label>
        <input
                required
                type="text"
                name="telefone"
                id="telefone"
                placeholder="Digite seu telefone"
        />

        <label for="data">Data de nascimento:</label>
        <input
                required
                type="date"
                name="data"
                id="data"
        />

        <button type="submit">Cadastrar</button>

        <p>Já é cadastrado? <a href="/">Login</a>.</p>
    </form>
</div>
</body>
</html>
